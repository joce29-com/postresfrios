<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Postres Fríos</title>

    <style>
        body {
           
            background-color: #e0f7fa;
            text-align: center;
            margin: 0;
        }

        header {
            background-color: #2196a6;
            color: white;
            padding: 25px;
        }

        nav {
            background-color: #b2ebf2;
            padding: 25px;
        }

        nav a {
            margin: 10px;
            color: #006064;
            text-decoration: none;
            font-weight: bold;
        }

        section {
            background-color: white;
            margin: 20px auto;
            padding: 20px;
            width: 80%;
           
        }

        .postre {
            background-color: #e0f7fa;
            display: inline-block;
            padding: 15px;
            margin: 10px;
            width: 200px;
            border-radius: 10px;
        }

        button {
            background-color: #2196a6;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #006064;
        }

        footer {
            background-color: #2196a6;
            color: white;
            padding: 15px;
        }
    </style>
</head>

<body>

    <header>
        <h1>❄️ Postres Fríos</h1>
        <p>¡Disfruta de sabores frescos y deliciosos!</p>
    </header>

    <section>
        <h2>Nuestros postres fríos</h2>

        <div class="postre">
            <h3>Helado</h3>
          <p>&nbsp;</p>
            <img src="helado.jpg" width="200" height="200" alt=""/>
<p>Helado cremoso de vainilla, fresa o chocolate.</p>
            <p><strong>$35 MXN</strong></p>
            <button onclick="alert('¡Elegiste un helado!')">
                Elegir
            </button>
        </div>

        <div class="postre">
            <h3>Gelatina</h3>
          <p>&nbsp;</p>
<h3><img src="gelatina.jpg" width="200" height="200" alt=""></h3>
<p>Gelatina dulce de diferentes sabores.</p>
            <p><strong>$20 MXN</strong></p>
            <button onclick="alert('¡Elegiste una gelatina!')">
                Elegir
            </button>
        </div>

        <div class="postre">
            <h3>Pay de queso</h3>
            <p>&nbsp;</p>
<h3><img src="pay.jpg" width="200" height="200" alt=""></h3>
<p>Postre cremoso con base de galleta.</p>
            <p><strong>$45 MXN</strong></p>
            <button onclick="alert('¡Elegiste un pay de queso!')">
                Elegir
            </button>
        </div>
    </section>

    
    <footer>
        <p>© 2026 Deli Postres</p>
    </footer>

</body>
</html>
